 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIVE TEXT ANALYZER</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
         *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
         }
         body{
            background:#050510 ;
            font-family: 'poppins',sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: radial-gradient(ellipse at 20% 50%, rgba(120,40,200,0.15) 0%, transparent 50%),
            radial-gradient(ellipse at 80% 20%, rgba(0,200,255,0,1) 0%, transparent 50%),
            radial-gradient(ellipse at 60% 80%, rgba(255,100,150,0,1), 0%, transparent 50%);
            overflow: hidden;
         }
         /* STARS BACKGROUND */
         body::before {
            content: "";
            position : fixed;
            top: 0; left:0;
            width:100%; height: 100%;
            background-image :
            radial-gradient(1px 1px at 10% 15%, white, transparent),
            radial-gradient(1px 1px at 25% 35% white, transparent),
             radial-gradient(1px 1px at 40% 10% white, transparent),
              radial-gradient(1px 1px at 55% 60% white, transparent),
               radial-gradient(1px 1px at 70% 25% white, transparent),
                radial-gradient(1px 1px at 85% 75% white, transparent),
                 radial-gradient(1px 1px at 15% 80% white, transparent),
                  radial-gradient(1px 1px at 90% 45% white, transparent),
                   radial-gradient(1px 1px at 35% 90% white, transparent),
                    radial-gradient(1px 1px at 65% 5% white, transparent),
                     radial-gradient(1.5px 1.5px at 50% 50%, rgba(255,255,255,0,8), transparent),
                      radial-gradient(1.5px 1.5px at 75% 85%, rgba(255,255,255,0,6), transparent),
                       radial-gradient(1.5px 1.5px at 20% 55%, rgba(255,255,255,0,7), transparent);
                       pointer-events: none;
                       z-index : 0;
                      }
                      .container {
                        text-align:center;
                        padding: 40px;
                        max-width: 850px;
                        width:90%;
                        position: relative;
                        z-index: 1;

                      }
                      .title {
                        font-family: 'Orbitron', sans-serif;
                        font-size: 2.8rem;
                        background: linear-gradient(135deg, #fff 0%, #c084fc 40%, #38bdf8 70% , #f472b6 100%);
                        -webkit-background-clip: text;
                        -webkit-text-fill-color: transparent;
                        background-clip: text;
                        text-shadow: none;
                        margin-bottom: 10px;
                        filter: drop-shadow(0 0 20px rgba(192,132,252,0,6));
                      }
                      .subtitle{
                        color: #94a3b8;
                        font-size: 1rem;
                        margin-bottom: 35px;
                        letter-spacing: 2px;
                        text-transform: uppercase;
                      }
                      textarea {
                        width: 100%;
                        height: 200px;
                        background: rgba(255,255,255,0.03);
                        border: 2px solid rgba(192,132,252,0.3);
                        border-radius:  25px;
                        padding: 10px;
                        color: #e2e8f0;
                        font-size: 1rem;
                        font-family: 'Poppins', sans-serif;
                        resize: none;
                        outline:none;
                        transition: all 0.4s ease;
                        backdrop-filter: blur(10px);
                      }
                      textarea:focus {
                        border-color: #c084fc;
                        box-shadow: 0 0 20px rgba(192,132,252,0.2),
                         0 0 60px rgba(192,132,252,0.1),
                         inset  0 0 20px rgba(192,132,252,0.05);
                      }
                      textarea::placeholder{
                        color: rgba(255,255,255,0.2);
                        font-style : italic;
                      }
                      .stats {
                        display: flex;
                        justify-content: center;
                       gap: 20px;
                       margin-top: 35px;
                       flex-wrap: wrap;
                      }
                      /* EACH CARD - UNIQUE COLOR */
                      .card {
                        border-radius: 20px;
                        padding: 28px 36px;
                        min-width: 160px;
                        transition: transform 0.3s ease, box-shadow 0.3s ease;
                        position: relative;
                        overflow: hidden;
                        backdrop-filter: blur(10px);
                      }
                      .card::before {
                        content: '';
                        position: absolute;
                        top: -50%; left: -50%;
                        width: 200%; height: 200%;
                        background: radial-gradient(circle, rgba(255,255,255,0.05) 0%, transparent 60%);
                        pointer-events: none;
                      }
                      /* Card 1 -Purple */
                      .card:nth-child(1) {
                        background: rgba(139,92,246,0.1);
                        border: 1px solid rgba(139,92,246,0.4);
                      }
                      .card:nth-child(1) .number {
                        color: #a78bfa;
                        text-shadow: 0 0 20px #a78bfa, 0 0 40px rgba(167,139,250,0.5);
                      }
                      .card:nth-child(1) :hover {
                        box-shadow: 0 15px 50px rgba(139,92,246,0.4);
                      }
                      /* Card 2 -Cyan */
                      .card:nth-child(2) {
                        background:  rgba(6,182,212,0.1);
                        border: 1px solid rgba(6,182,212,0.4);
                      }
                      .card:nth-child(2) .number {
                        color: #22d3ee;
                        text-shadow: 0 0 20px #22d3ee, 0 0 40px rgba(34,211,238,0.5);
                      }
                      .card:nth-child(2):hover {
                        box-shadow: 0 15px 50px rgba(6,182,212,0.4);
                      }
                      /* Card 3 - Pink */
                      .card:nth-child(3) {
                      background: rgba(244,114,182,0.1);
                      border: 1px solid rgba(244,114,182,0.4);  
                      }
                      .card:nth-child(3) .number {
                        color:  #f472b6;
                        text-shadow: 0 0 20px #f472b6, 0 0 40px rgba(244,114,182,0.5);
                      }
                      .card:nth-child(3):hover {
                        box-shadow: 0 15px 50px rgba(244,114,182,0.4);
                      }
                      /* Card 4 - Gold */
                      .card:nth-child(4) {
                        background: rgba(251,191,36,0.1);
                        border: 1px solid rgba(251,191,36,0.4);
                      }
                      .card:nth-child(4) .number {
                        color: #fbbf24;
                        text-shadow: 0 0 20px #fbbf24, 0 0 40px rgba(251,191,36,0.5);
                      }
                      .card:nth-child(4):hover {
                        box-shadow: 0 15px 50px rgba(251,191,36,0.4);
                      }
                      .card:hover {
                        transform: translateY(-10px) scale(1.03);
                      }
                      .number {
                        display: block;
                        font-family: 'Orbitron' , sans-serif;
                        font-size: 2.2rem;
                        font-weight: 700;  
                      }
                      .label {
                        display: block;
                        color: #94a3b8;
                        font-size: 0.8rem;
                        margin-top: 8px;
                        letter-spacing: 1px;
                        text-transform: uppercase;
                      }
                      /* ANIMATED GLOW RING AROUND TEXTAREA */
                      @keyframes borderGlow {
                        0% { border-color: rgba(139,92,246,0.4);}
                        25%{ border-color: rgba(6,182,212,0.4);}
                        50%{ border-color: rgba(244,114,182,0.4);}
                        75%{ border-color: rgba(251,191,36,0.4);}
                        100%{ border-color: rgba(139,92,246,0.4);}
                      }
                      textarea {
                        animation: borderGlow 4s infinite;
                      }
                      /* COUNTER ANIMATION */
                      @keyframes countPop {
                        0% { transform: scale(1);}
                        50% { transform: scale(1.3);}
                        100% { transform: scale(1);}
                      }
                      .pop {
                        animation: countPop 0.3s ease;
                      }
                      /* BOTTOM TAGLINE */
                      .footer {
                        margin-top: 40px;
                        color: rgba(255,255,255,0.2);
                        font-size: 0.75rem;
                        letter-spacing: 3px;
                        text-transform: uppercase;
                      }
    </style>
</head>
 <body>
    <div class="container">
        <h1 class="title">✨ LIVE TEXT ANALYZER</h1>
        <p class="subtitle">Type anything. Watch the magic happen</p>
        <textarea id="textInput" placeholder="  Start typing here...."></textarea>
        <div class="stats">
            <div class="card" id="words">
                <span class="number">0</span>
                <span class="label">Words</span>
            </div>
            <div class="card" id="chars">
                <span class="number">0</span>
                <span class="label">Characters</span>
            </div>   
        <div class="card" id="sentences">
            <span class="number">0</span>
            <span class="label">Sentences</span>
        </div>
        <div class="card" id="reading">
            <span class="number">0</span>
            <span class="label">sec Read Time</span>
        </div>     
    </div>
    <p class="footer">✨ built by Srilaksha — live text analyze</p>
    </div>
 <script>
  window.onload = function(){
  const textInput = document.getElementById('textInput');
   function animateNumber(elementId) {
    const el = document.querySelector(`#${elementId} .number`);
    if (!el) return;
    el.classList.remove('pop');
    void el.offsetWidth;
    el.classList.add('pop');
   }
   textInput.addEventListener('input',function(){
    const text = textInput.value;
    //COUNTS
    const words = text.trim() === '' ? 0 : text.trim().split(/\s+/).length;
    const chars = text.length;
    const sentences = text === '' ?  0 : (text.match(/[.!?]+/g) || []).length;
    const readingTime = words < 1 ? 0 : Math.ceil((words /  200) * 60);
    //UPDATE + ANIMATE
    document.querySelector('#words .number').textContent = words;
    document.querySelector('#chars .number').textContent = chars;
    document.querySelector('#sentences .number').textContent = sentences;
    document.querySelector('#reading .number').textContent = readingTime;
    animateNumber('words');
    animateNumber('chars');
    animateNumber('sentences');
    animateNumber('reading');
   });
  }
 </script>
  </body>
 </html>
